# Builds the reading site from the notes and publishes it to GitHub Pages at
# energy.lonelymtnlabs.com. Runs on every push to main, so a merged note is
# live a minute later.
name: Reader site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python reader/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reader/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
